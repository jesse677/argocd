apiVersion: apps/v1
kind: Deployment
metadata:
  name: civic-radar
  namespace: civic-radar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: civic-radar
  template:
    metadata:
      labels:
        app: civic-radar
    spec:
      containers:
      - name: civic-radar
        image: ghcr.io/jesse677/civic-radar:latest
        command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: civic-radar-config
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: civic-radar-secrets
              key: pg-password
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: civic-radar-secrets
              key: session-secret
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: civic-radar
  namespace: civic-radar
spec:
  selector:
    app: civic-radar
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
