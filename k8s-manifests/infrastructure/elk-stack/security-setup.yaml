apiVersion: v1
kind: ConfigMap
metadata:
  name: elasticsearch-security-setup
  namespace: elk
data:
  setup.sh: |
    #!/bin/sh
    set -eu

    ES_URL="http://elasticsearch-http:9200"
    AUTH="elastic:${ELASTIC_PASSWORD}"

    echo "Waiting for Elasticsearch..."
    until curl -s -o /dev/null "${ES_URL}/_cluster/health"; do
      sleep 5
    done

    echo "Setting kibana_system password..."
    curl -s -X POST "${ES_URL}/_security/user/kibana_system/_password" \
      -u "${AUTH}" \
      -H 'Content-Type: application/json' \
      -d "{ \"password\": \"${KIBANA_SYSTEM_PASSWORD}\" }"

    echo "Applying logstash_writer role..."
    curl -s -X PUT "${ES_URL}/_security/role/logstash_writer" \
      -u "${AUTH}" \
      -H 'Content-Type: application/json' \
      -d '{
        "cluster": ["manage_index_templates", "monitor", "manage_ilm"],
        "indices": [
          {
            "names": ["logstash-*"],
            "privileges": ["write", "create", "create_index", "manage", "manage_ilm"]
          }
        ]
      }'

    echo "Applying logstash_internal user..."
    curl -s -X PUT "${ES_URL}/_security/user/logstash_internal" \
      -u "${AUTH}" \
      -H 'Content-Type: application/json' \
      -d "{
        \"password\": \"${LOGSTASH_INTERNAL_PASSWORD}\",
        \"roles\": [\"logstash_writer\"]
      }"

    echo "Done."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: elasticsearch-security-setup
  namespace: elk
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: security-setup
        image: curlimages/curl:8.10.1
        command: ["/bin/sh", "/scripts/setup.sh"]
        env:
        - name: ELASTIC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: elk-credentials
              key: elastic-password
        - name: KIBANA_SYSTEM_PASSWORD
          valueFrom:
            secretKeyRef:
              name: elk-credentials
              key: kibana-system-password
        - name: LOGSTASH_INTERNAL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: elk-credentials
              key: logstash-internal-password
        volumeMounts:
        - name: script
          mountPath: /scripts
      volumes:
      - name: script
        configMap:
          name: elasticsearch-security-setup
          defaultMode: 0755
